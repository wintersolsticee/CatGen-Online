services:
  - type: web
    name: catgen
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: catgen-db
          property: connectionString
      - key: CLIENT_ORIGIN
        value: https://playcatgen.gg,https://www.playcatgen.gg
databases:
  - name: catgen-db
    plan: free
    databaseName: catgen
    user: catgen
